server {
    listen 80;
    server_name 13.205.216.81 careers.ris.org.in careers.ris-tms.org;

    # React Frontend Static Build
    location / {
        root /var/www/HR_RIS/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Backend API Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Max file upload size (15MB for resumes)
        client_max_body_size 15M;
    }
}

# HTTPS Server (Port 443)
server {
    listen 443 ssl;
    server_name 13.205.216.81 careers.ris-tms.org careers.ris.org.in;

    ssl_certificate /etc/letsencrypt/live/careers.ris-tms.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/careers.ris-tms.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # React Frontend Static Build
    location / {
        root /var/www/HR_RIS/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Backend API Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Max file upload size (15MB for resumes)
        client_max_body_size 15M;
    }
}

