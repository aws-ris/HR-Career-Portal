name: RIS HR Portal CI/CD Deployment Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Build & Test Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies & Validate Syntax
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m py_compile main.py schemas.py database/models.py

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies & Test Build
        run: |
          npm ci
          npm run build

  deploy:
    name: Deploy to AWS EC2
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: SSH Deploy to AWS EC2 t3.large Instance
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Starting deployment on EC2 instance..."
            cd /var/www/HR_RIS
            
            # Pull latest changes from git
            git pull origin main || git pull origin master
            
            # Backend update
            cd /var/www/HR_RIS/backend
            source venv/bin/activate
            pip install -r requirements.txt
            
            # Frontend build
            cd /var/www/HR_RIS
            npm ci
            npm run build
            
            # Restart Services
            sudo systemctl restart hr_backend
            sudo systemctl reload nginx
            
            echo "Deployment completed successfully!"
