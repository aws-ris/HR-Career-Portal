name: RIS HR Portal EC2 All-In-One CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_and_deploy_ec2:
    name: Build & Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Backend Syntax
        run: |
          cd backend
          python -m py_compile main.py schemas.py database/models.py

      - name: SSH Deploy & Build on AWS EC2 Instance
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Starting deployment on EC2 instance (13.205.216.81)..."
            
            # 1. Update Repository Code
            cd /var/www/HR_RIS
            git fetch --all
            git reset --hard origin/main || git reset --hard origin/master
            
            # 2. Update Backend Python Dependencies
            cd /var/www/HR_RIS/backend
            source venv/bin/activate
            pip install -r requirements.txt gunicorn uvicorn psycopg2-binary boto3 openpyxl
            
            # 3. Build React Frontend Static Assets
            cd /var/www/HR_RIS
            if command -v npm &> /dev/null; then
              npm install
              npm run build
            fi
            
            # 4. Restart Services
            if [ -f "/etc/systemd/system/hr_portal_backend.service" ]; then
              sudo systemctl restart hr_portal_backend
            fi
            
            sudo cp /var/www/HR_RIS/backend/scripts/nginx_hr_portal.conf /etc/nginx/sites-available/hr_portal_site.conf
            sudo ln -sf /etc/nginx/sites-available/hr_portal_site.conf /etc/nginx/sites-enabled/
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -t && sudo systemctl reload nginx
            
            echo "Deployment completed successfully!"
